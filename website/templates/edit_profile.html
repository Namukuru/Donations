{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<div class="container mt-5">
    <div class="card profile-card shadow-lg p-4">
        <div class="card-body">
            <h2 class="card-title mb-4 text-primary text-center">Edit Profile</h2>

            <!-- Display messages -->
            {% if messages %}
                <div class="alert alert-success">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                
                <!-- Email Update -->
                <div class="mb-3">
                    <label class="form-label"><strong>Email:</strong></label>
                    {{ form.email }}
                </div>

                {% if agent %}
                <!-- Phone Update -->
                <div class="mb-3">
                    <label class="form-label"><strong>Phone:</strong></label>
                    <input type="text" name="phone" class="form-control" value="{{ agent.phone }}">
                </div>

                <!-- Location Update -->
                <div class="mb-3">
                    <label class="form-label"><strong>Location:</strong></label>
                    <!-- Dropdown to choose current or another location -->
                    <select id="location-select" class="form-select" name="location_option">
                        <option value="current" selected>Use Current Location</option>
                        <option value="another">Use Another Location</option>
                    </select>

                    <!-- Location input -->
                    <input type="text" id="location-input" name="location" class="form-control mt-2" value="{{ agent.location }}" disabled>

                    <!-- Map container (hidden by default) -->
                    <div id="map" style="height: 400px; width: 100%; display: none;"></div>
                </div>
                {% endif %}

                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                <a href="{% url 'profile' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>

<!-- Include Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<!-- Include custom JS for the map -->
<script src="{% static 'js/edit_profile.js' %}"></script>

{% endblock %}
