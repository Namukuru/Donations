{% extends 'base.html' %}
{% block content %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">

<div class="container mt-5">
    <div class="card profile-card shadow-lg p-4">
        <div class="card-body">
            <h2 class="card-title mb-4 text-primary text-center">Edit Profile</h2>

            <!-- Display messages -->
            {% if messages %}
                <div class="alert alert-success">
                    {% for message in messages %}
                        {{ message }}
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                
                <!-- Email Update -->
                <div class="mb-3">
                    <label class="form-label"><strong>Email:</strong></label>
                    {{ form.email }}
                </div>

                {% if agent %}
                <!-- Phone Update -->
                <div class="mb-3">
                    <label class="form-label"><strong>Phone:</strong></label>
                    <input type="text" name="phone" class="form-control" value="{{ agent.phone }}">
                </div>

                <!-- Location Update -->
                <div class="mb-3">
                    <label class="form-label"><strong>Location:</strong></label>
                    <input type="text" name="location" class="form-control" value="{{ agent.location }}">
                </div>
                {% endif %}

                <button type="submit" class="btn btn-primary w-100">Save Changes</button>
                <a href="{% url 'profile' %}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
            </form>
        </div>
    </div>
</div>

<style>
    .profile-card {
        max-width: 500px;
        margin: auto;
        border-radius: 10px;
        background: white;
        transition: 0.3s;
    }

    .profile-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .profile-info p {
        font-size: 1.1rem;
        margin-bottom: 10px;
    }
</style>

{% endblock %}
