<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompassionNet</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <!-- Logo aligned left -->
        <a class="navbar-brand me-auto" href="{% url 'home' %}">
          CompassionNet
        </a>

        <!-- Navbar Toggler for mobile view -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Centered Nav Items -->
        <div class="collapse navbar-collapse justify-content-center" id="navbarSupportedContent">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="{% url 'home' %}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'home' %}">About Us</a>
            </li>
            {% if user.is_authenticated %}
            <li class="nav-item">
              <a class="nav-link" href="{% url 'account' %}">My Account</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{% url 'home' %}">Reports</a>
            </li>
            {% endif %}
          </ul>
        </div>

        <!-- Auth buttons aligned right -->
        <div class="d-flex ms-auto">
          {% if user.is_authenticated %}
          <a href="{% url 'logout' %}" class="btn btn-outline-danger me-3">
            Logout
          </a>
          {% else %}
          <a href="{% url 'register' %}" class="btn btn-outline-success me-3">
            Register
          </a>
          <a href="{% url 'loginUser' %}" class="btn btn-outline-primary">
            LogIn
          </a>
          {% endif %}
        </div>
      </div>
    </nav>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
