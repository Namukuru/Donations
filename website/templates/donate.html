{% extends 'base.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
    }
    .form-container {
        max-width: 400px;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        margin: auto;
    }
    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }
    input, select, textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    .donation-type {
        margin-bottom: 20px;
    }
    .hidden {
        display: none;
    }
  </style>
</head>
<body>
  <div class="col-md-6 offset-md-3 form-container">
    <h1>Make a Donation</h1>
    <form method="post">
      {% csrf_token %}

      <!-- Donation Type Selection -->
      <label for="donation-type">Donation Type:</label>
      <select id="donation-type" name="donation_type" class="donation-type">
        <option value="monetary">Monetary Donation</option>
        <option value="in-kind">In-Kind Donation</option>
      </select>

      <!-- Monetary Donation Fields -->
      <div id="monetary-fields">
        <label for="{{ form.amount.id_for_label }}">Amount:</label>
        {{ form.amount }}

        <label for="{{ form.message.id_for_label }}">Message:</label>
        {{ form.message }}
      </div>

      <!-- In-Kind Donation Fields -->
      <div id="in-kind-fields" class="hidden">
        <label for="item-name">Item Name:</label>
        <input type="text" id="item-name" name="item_name" placeholder="Enter item name">

        <label for="item-description">Item Description:</label>
        <textarea id="item-description" name="item_description" placeholder="Describe the item"></textarea>

        <label for="item-quantity">Quantity:</label>
        <input type="number" id="item-quantity" name="item_quantity" placeholder="Enter quantity">
      </div>

      <!-- Pickup Section -->
      <div id="pickup-section" class="hidden">
        <label for="{{ form.pickup_choice.id_for_label }}">Pickup Choice:</label>
        {{ form.pickup_choice }}

        <label for="pickup-location">Pickup Location:</label>
        <input type="text" id="pickup-location" name="pickup_location" placeholder="Enter preferred address" disabled>
      </div>

      <br>
      <br>
      <button type="submit" class="btn btn-primary">Donate</button>
      <a href="{% url 'account' %}" class="btn btn-secondary">Back</a>
    </form>
  </div>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const donationType = document.querySelector("#donation-type");
        const monetaryFields = document.querySelector("#monetary-fields");
        const inKindFields = document.querySelector("#in-kind-fields");
        const pickupSection = document.querySelector("#pickup-section"); // Reference for pickup fields
        const pickupChoice = document.querySelector("select[name='pickup_choice']");
        const pickupLocation = document.querySelector("input[name='pickup_location']");

        // Show/hide fields based on donation type
        donationType.addEventListener("change", function () {
            if (donationType.value === "monetary") {
                // Show monetary fields, hide in-kind and pickup fields
                monetaryFields.classList.remove("hidden");
                inKindFields.classList.add("hidden");
                pickupSection.classList.add("hidden");
            } else {
                // Show in-kind and pickup fields, hide monetary fields
                monetaryFields.classList.add("hidden");
                inKindFields.classList.remove("hidden");
                pickupSection.classList.remove("hidden");
            }
        });

        // Handle pickup choice logic
        pickupChoice.addEventListener("change", function () {
            if (pickupChoice.value === "current") {
                pickupLocation.disabled = false;  // Enable it before submitting
                getCurrentLocation();
            } else {
                pickupLocation.disabled = false;
                pickupLocation.value = "";
                pickupLocation.placeholder = "Enter preferred address";
            }
        });

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        pickupLocation.value = `${position.coords.latitude}, ${position.coords.longitude}`;
                    },
                    (error) => {
                        alert("Error getting location. Please allow location access.");
                    }
                );
            } else {
                alert("Geolocation is not supported by your browser.");
            }
        }
    });
  </script>
</body>
</html>
{% endblock %}
