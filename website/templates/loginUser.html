{%extends 'base.html'%} 
{%block content%}
  <div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
      <div class="card-body text-center">
        {% if user.is_authenticated %}
          <h1 class="card-title">Home</h1>
        {% else %}
          <h1 class="card-title">Log In</h1>
          <br />
          <form method="POST" action="{% url 'login_user' %}">
            {% csrf_token %}
            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                name="username"
                placeholder="Username"
                required
              />
            </div>
            <div class="mb-3">
              <input
                type="password"
                class="form-control"
                placeholder="Password"
                name="password"
                required
              />
            </div>
            <br />
            <button type="submit" class="btn btn-secondary w-100">Log In</button>
          </form>

          <!-- Register Link -->
          <div class="mt-3">
            <p class="mb-0">Don't have an account?</p>
            <a href="{% url 'register' %}" class="text-decoration-none">Register here</a>
          </div>
        {% endif %}
      </div>
    </div>
  </div>
{%endblock%}
